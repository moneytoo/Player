name: Android Build APK
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v0.*'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build APK (Unsigned Release)
        run: ./gradlew assembleLatestUniversalRelease
      - name: Sign APK with uber-apk-signer
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer-1.3.0.jar --apks app/build/outputs/apk/latestUniversal/release/*.apk --overwrite
      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jaziri-Player-APK
          path: app/build/outputs/apk/latestUniversal/release/*.apk
